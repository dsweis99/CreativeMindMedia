<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Creative Minds Media — Portland Branding & Digital Marketing</title>
    <script>
      // Apply the default before React loads, so the site does not flash white.
      if (localStorage.getItem('theme') !== 'light') document.documentElement.classList.add('dark');
    </script>
  </head>
  <body>
    <script>
      window.addEventListener('error', function(e) {
        fetch('/api/log-error', { method: 'POST', body: e.message });
      });
      window.addEventListener('unhandledrejection', function(e) {
        fetch('/api/log-error', { method: 'POST', body: e.reason });
      });
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
